[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-daily-digest"
version = "0.1.0"
description = "Daily digest of yesterday's Claude Code, Codex and Antigravity CLI sessions, written into an Obsidian vault"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.2"]

[project.scripts]
ai-daily-digest = "ai_daily_digest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
