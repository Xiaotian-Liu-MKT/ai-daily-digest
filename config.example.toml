# Copy to config.toml (git-ignored) and fill in. Every key of Config in
# src/ai_daily_digest/config.py can be overridden here.

# 滴答清单: create an app at https://developer.dida365.com/manage and set its
# OAuth redirect URL to the value of dida_redirect_uri, then run
#   .venv\Scripts\python -m ai_daily_digest dida auth
dida_client_id = ""
dida_client_secret = ""
dida_redirect_uri = "http://127.0.0.1:8765/callback"
dida_due_days = 7

# Shelved projects: reports describe them but list no follow-ups.
shelved_projects = []

# Daily investment scan (sibling repo investment-research + Codex CLI). Set
# invest_enabled = false to skip; a missing repo is skipped quietly.
# invest_repo = "E:/GitHub/investment-research"
# invest_python = ""   # empty: <invest_repo>/.venv/Scripts/python.exe (Windows) or .venv/bin/python
# codex_cmd = ""       # empty: codex / codex.cmd from PATH
invest_enabled = true
codex_model = "gpt-6.1-sol"
invest_scan_timeout_s = 1200
codex_timeout_s = 900
